spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=wallet-service
spring.cloud.gateway.routes[0].uri=lb://wallet-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/wallets/**
spring.cloud.gateway.routes[1].id=transfer-service
spring.cloud.gateway.routes[1].uri=lb://transfer-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/transfers/**
